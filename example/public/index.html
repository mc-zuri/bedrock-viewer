<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bedrock viewer</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #87ceeb; }
    .panel {
      position: fixed; left: 12px; z-index: 10; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 8px 10px; border-radius: 8px; background: rgba(20, 20, 24, 0.82); color: #eee;
      font: 13px/1.3 system-ui, sans-serif; max-width: calc(100vw - 48px);
    }
    .panel[hidden] { display: none; }
    #controls { top: 12px; }
    /* bottom-left, stacked so the story's caption sits above the block's info */
    #bottom { position: fixed; left: 12px; bottom: 12px; z-index: 10; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; pointer-events: none; }
    #bottom .panel { position: static; pointer-events: auto; }
    #story { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 8px; }
    #info { font-family: ui-monospace, monospace; }
    #info:has(#block:empty) { display: none; }
    #caption { flex-direction: column; align-items: flex-start; gap: 3px; max-width: min(520px, calc(100vw - 48px)); font-size: 14px; opacity: 0; transition: opacity 0.6s; }
    #caption.shown { opacity: 1; }
    #captionTitle:empty, #captionText:empty { display: none; }
    #follow, #next { border: 0; cursor: pointer; }
    #follow:hover, #next:hover { background: rgba(44, 44, 52, 0.9); }
    .panel select, .panel input, .panel button { font: inherit; padding: 3px 6px; border-radius: 4px; border: 1px solid #555; background: #2a2a30; color: #eee; }
    .panel input { width: 240px; }
    #status { color: #aaa; }
    .panel a { color: #8cc8ff; }
  </style>
</head>
<body>
  <div id="controls" class="panel">
    <label>Version <select id="version"></select></label>
    <label>Scene <select id="scene"></select></label>
    <input id="filter" placeholder="block name regex (states scene)">
    <button id="go">Show</button>
    <a id="entitiesLink" href="entities.html" title="every entity of the version: focus one, set its mode, equipment and flags, play its actions and animations">All entities</a>
    <a id="particlesLink" href="particles.html" title="every particle effect of the version, played side by side">All particles</a>
    <span id="status"></span>
  </div>
  <div id="bottom">
    <div id="story">
      <div id="caption" class="panel" hidden><b id="captionTitle"></b><span id="captionText"></span></div>
      <button id="follow" class="panel" hidden>▶ Follow the story</button>
      <button id="next" class="panel" hidden title="skip to the story's next part">Next ⏭</button>
    </div>
    <div id="info" class="panel"><span id="block"></span></div>
  </div>
  <script src="client.js"></script>
</body>
</html>
